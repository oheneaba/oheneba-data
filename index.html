<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oheneba Data - Fixed Buttons</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f7fb;padding:15px}
.box{max-width:460px;margin:20px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
h1{text-align:center;color:#0a58ca}
.sub{text-align:center;color:#666;margin:8px 0 15px}
label{font-weight:700;display:block;margin:12px 0 5px}
input,select{width:100%;padding:13px;border:2px solid #ddd;border-radius:9px;font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:10px;font-weight:800;margin-top:12px;cursor:pointer;color:#fff;font-size:16px;display:block}
.momo{background:#0a58ca}
.airtime{background:#ff9800}
.price{text-align:center;background:#e7f0ff;padding:12px;border-radius:8px;margin-top:12px;font-weight:800;color:#0a58ca;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h1>🚀 Oheneba Data</h1>
<p class="sub">MTN • Telecel • AT - Instant</p>

<label>Network</label>
<select id="net"><option value="MTN">MTN</option><option value="Telecel">Telecel</option><option value="AT">AT</option></select>

<label>Beneficiary Phone</label>
<input id="phone" type="tel" placeholder="024XXXXXXX">

<label>Bundle</label>
<select id="bundle">
<option value="1GB - GH¢5.5">1GB - GH¢5.5</option>
<option value="2GB - GH¢10">2GB - GH¢10</option>
<option value="3GB - GH¢15">3GB - GH¢15</option>
<option value="5GB - GH¢22">5GB - GH¢22 - Hot 🔥</option>
<option value="10GB - GH¢40">10GB - GH¢40</option>
<option value="15GB - GH¢55">15GB - GH¢55</option>
<option value="20GB - GH¢65">20GB - GH¢65</option>
</select>

<div class="price" id="pr">Amount: GH¢5.5</div>

<!-- FIXED BUTTONS - NOW WITH ID -->
<button id="btnMomo" class="momo">💰 Pay with MoMo / Card / Bank (Paystack)</button>
<button id="btnAirtime" class="airtime">📱 Buy with Airtime - Transfer Airtime to Us</button>

<p style="text-align:center;font-size:12px;margin-top:12px;color:#555">Pay to: MoMo 0202964947 • Airtime 0202964947<br>Clicking will open WhatsApp</p>
</div>

<script>
// Update price
document.getElementById('bundle').addEventListener('change', function(){
  let val = this.value;
  let price = val.split('GH¢')[1];
  document.getElementById('pr').innerText = "Amount: GH¢" + price;
});

function getPhone(){
  let p = document.getElementById('phone').value.trim();
  if(p.length < 10){ alert("Please enter beneficiary phone first e.g. 024XXXXXXX"); return null; }
  return p;
}

document.getElementById('btnMomo').addEventListener('click', function(){
  let phone = getPhone();
  if(!phone) return;
  let net = document.getElementById('net').value;
  let bun = document.getElementById('bundle').value;
  let msg = `Hello Oheneba, I want to buy ${bun} (${net}) for ${phone}. I want to pay with MoMo. My MoMo number is: `;
  let url = "https://wa.me/233202964947?text=" + encodeURIComponent(msg);
  window.open(url, "_blank");
});

document.getElementById('btnAirtime').addEventListener('click', function(){
  let phone = getPhone();
  if(!phone) return;
  let net = document.getElementById('net').value;
  let bun = document.getElementById('bundle').value;
  let msg = `Hello Oheneba, I want to BUY WITH AIRTIME. I want ${bun} (${net}) for ${phone}. I will transfer airtime to 0202964947 now. Amount: `;
  let url = "https://wa.me/233202964947?text=" + encodeURIComponent(msg);
  // Instruction for airtime
  alert("To Pay with Airtime:\n\nMTN: Dial *198*Amount*0202964947*PIN#\nOr use MyMTN App > Airtime Transfer > 0202964947\n\nAfter transfer, click OK to send proof on WhatsApp");
  window.open(url, "_blank");
});
</script>
</body>
</html>
