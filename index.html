<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oheneba Data - Developer Console</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0d0e12;color:white;padding:12px;padding-bottom:80px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.logo{font-weight:bold;display:flex;align-items:center;gap:6px;font-size:18px}
.badge{background:#2a2110;color:#f5c518;padding:3px 8px;border-radius:10px;font-size:11px;margin-left:8px}
.card{background:#1a1c23;border-radius:20px;padding:18px;margin-top:14px}
.card2{background:linear-gradient(135deg,#1a1c23,#2a2110);border:1px solid #f5c51833}
.small{font-size:12px;color:#8b8e99;letter-spacing:0.5px}
.big{font-size:32px;font-weight:900;margin:12px 0}
.yellowbtn{background:#f5c518;color:black;border:none;padding:8px 16px;border-radius:20px;font-weight:bold}
input,select{background:#0d0e12;border:1px solid #2a2e39;color:white;padding:12px;border-radius:10px;width:100%;margin-top:10px}
.buy{background:#f5c518;color:black;border:none;width:100%;padding:14px;border-radius:12px;font-weight:900;margin-top:12px;font-size:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1c23;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.nav div{text-align:center;font-size:11px;color:#8b8e99}
.nav .active{color:#f5c518}
.dot{width:8px;height:8px;background:#ff4444;border-radius:50%;display:inline-block}
#msg{text-align:center;margin-top:10px;font-size:13px;color:#f5c518}
</style>
</head>
<body>

<div class="top">
<div class="logo">🐝 DataSika <span class="badge">BETA</span></div>
<div>☀️</div>
</div>
