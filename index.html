<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oheneba Data - Instant Bundles</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f7fb;padding:15px}
.box{max-width:460px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
h1{text-align:center;color:#0a58ca}
.sub{text-align:center;color:#666;margin:6px 0 15px}
label{font-weight:700;display:block;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px}
button{width:100%;padding:14px;background:#0a58ca;color:#fff;border:0;border-radius:8px;font-weight:700;margin-top:15px}
.price{text-align:center;background:#e7f0ff;padding:10px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h1>🚀 Oheneba Data</h1>
<p class="sub">MTN • Telecel • AT Instant</p>
<label>Network</label>
<select id="net"><option>MTN</option><option>Telecel</option><option>AT</option></select>
<label>Phone (beneficiary)</label>
<input id="phone" placeholder="024XXXXXXX">
<label>Email</label>
<input id="email" placeholder="you@gmail.com">
<label>Bundle</label>
<select id="bundle"><option value="1|5.5">1GB - GH¢5.5</option><option value="2|10">2GB - GH¢10</option><option value="5|22">5GB - GH¢22</option><option value="10|40">10GB - GH¢40</option></select>
<div class="price" id="pr">Pay: GH¢5.5</div>
<button onclick="pay()">Pay with Paystack</button>
<p style="text-align:center;margin-top:10px;font-size:13px">Failed? <a href="https://wa.me/233202964947?text=Hi%20Oheneaba%20I%20want%20data">Buy on WhatsApp</a></p>
</div>
<script>
const API="https://oheneba-data.onrender.com";
const PK="pk_test_c06ed1dabd7972a06ddddeee724fa1fb4d49d07a";
document.getElementById('bundle').onchange=e=>{document.getElementById('pr').innerText="Pay: GH¢"+e.target.value.split('|')[1]};
function pay(){
  const ph=document.getElementById('phone').value.trim();
  const em=document.getElementById('email').value.trim();
  const bv=document.getElementById('bundle').value;
  const [gb,amt]=bv.split('|');
  if(ph.length<10)return alert("Enter valid phone");
  if(!em.includes('@'))return alert("Enter valid email");
  PaystackPop.setup({
    key:PK,
    email:em,
    amount:Math.round(parseFloat(amt)*100),
    currency:"GHS",
    onClose:function(){if(confirm("Payment cancelled. Buy on WhatsApp?")){window.open("https://wa.me/233202964947?text=Hi Oheneaba I want "+gb+"GB for "+ph,"_blank")}},
    callback:function(res){
      alert("Payment OK: "+res.reference+". Sending data...");
      fetch(API+"/buy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:ph,network:document.getElementById('net').value,bundle:gb,reference:res.reference})}).then(r=>r.json()).then(d=>alert(d.message||"Success!")).catch(e=>alert("Paid but server error. Contact us with ref "+res.reference))
    }
  }).openIframe();
}
</script>
</body>
</html>
