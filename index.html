<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oheneba Data - Working</title>
<style>
body{font-family:sans-serif;background:#f0f8ff;padding:15px}
.box{max-width:400px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 10px #0002}
h1{color:#007bff;text-align:center}
select,input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ccc}
button{background:#007bff;color:#fff;font-weight:bold;border:0}
</style>
</head>
<body>
<div class="box">
<h1>Oheneba Data 🚀</h1>
<p style="text-align:center">Instant MTN • Telecel • AT</p>
<label>Network</label>
<select id="net"><option>MTN</option><option>Telecel</option><option>AT</option></select>
<label>Phone</label>
<input id="phone" placeholder="024XXXXXXX">
<label>Bundle</label>
<select id="bun">
<option>1GB - GH¢5.5</option>
<option>2GB - GH¢10</option>
<option>3GB - GH¢15</option>
<option>5GB - GH¢22</option>
<option>10GB - GH¢40</option>
<option>15GB - GH¢55</option>
<option>20GB - GH¢65</option>
</select>
<button onclick="order()">Order on WhatsApp - 0202964947</button>
<p style="text-align:center;font-size:12px;margin-top:10px">We deliver in 2 mins after MoMo</p>
</div>
<script>
function order(){
 let ph=document.getElementById('phone').value;
 let net=document.getElementById('net').value;
 let bun=document.getElementById('bun').value;
 if(ph.length<10){alert('Enter phone');return}
 let msg=`Hello Oheneba, I want ${bun} ${net} for ${ph}. I will pay now.`;
 window.open(`https://wa.me/233202964947?text=${encodeURIComponent(msg)}`);
}
</script>
</body>
</html>
