<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oheneba Data - Cheap Data Bundles Ghana</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#000;color:#FFD700;padding:15px;text-align:center;font-weight:bold;font-size:20px}
.tabs{display:flex;background:white;box-shadow:0 2px 5px #0001}
.tab{flex:1;padding:12px;text-align:center;font-weight:bold;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{border-color:#FFD700;color:#000}
.bundle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.bundle{background:white;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}
.bundle h3{margin:5px 0}.bundle button{background:#000;color:#FFD700;border:none;padding:10px 20px;border-radius:20px;width:100%;font-weight:bold}
.notice{background:#fff3cd;padding:10px;margin:10px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="header">OHENEBA DATA</div>
<div class="notice">⚠️ Bonus airtime CANNOT buy data. Use MoMo or main airtime balance.</div>

<div class="tabs">
<div class="tab active" onclick="showNet('mtn')">MTN</div>
<div class="tab" onclick="showNet('telecel')">Telecel</div>
<div class="tab" onclick="showNet('at')">AirtelTigo</div>
</div>

<div id="bundles" class="bundle-grid"></div>

<script>
const bundles = {
 mtn: [{gb:'1GB',price:6},{gb:'2GB',price:11},{gb:'5GB',price:24},{gb:'10GB',price:42}],
 telecel: [{gb:'5GB',price:22},{gb:'10GB',price:38},{gb:'15GB',price:55}],
 at: [{gb:'5GB',price:22},{gb:'10GB',price:40}]
}
let currentNet='mtn';

function showNet(net){
 currentNet=net;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 event.target.classList.add('active');
 render();
}
function render(){
 let html='';
 bundles[currentNet].forEach(b=>{
   html+=`<div class="bundle"><h3>${b.gb}</h3><p>GHS ${b.price}</p><button onclick="buy('${b.gb}',${b.price})">Buy Now</button></div>`;
 });
 document.getElementById('bundles').innerHTML=html;
}
render();

function buy(gb,price){
 let phone = prompt(`Enter ${currentNet.toUpperCase()} number to receive ${gb}:`);
 if(!phone) return;
 let email = prompt("Enter your email for receipt:");

 let handler = PaystackPop.setup({
   key: 'pk_live_YOUR_PUBLIC_KEY_HERE', // <- REPLACE WITH YOUR KEY
   email: email,
   amount: price*100,
   currency: 'GHS',
   metadata: {custom_fields: [{display_name:"Phone",variable_name:"phone",value:phone},{display_name:"Bundle",variable_name:"bundle",value:gb},{display_name:"Network",variable_name:"network",value:currentNet}]},
   callback: function(response){
     alert('Payment successful! Ref: '+response.reference+' We will send '+gb+' to '+phone+' now.');
     // HERE you call your backend API to deliver data
     fetch('/deliver.php', {method:'POST', body: JSON.stringify({phone,gb,network:currentNet,ref:response.reference})})
   },
   onClose: function(){ alert('Payment cancelled'); }
 });
 handler.openIframe();
}
</script>
</body>
</html>
